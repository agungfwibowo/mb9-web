# Deploy ke GitHub Pages setiap push ke main (atau manual dari tab Actions).
# Aktifkan sekali: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # JS ditulis per modul di src/js → dibundel ulang ke assets/js/main.js,
      # jadi yang terbit selalu sesuai sumber walau lupa `npm run build`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build JS
        run: npm ci && npm run build

      # Hanya file situs yang ikut terbit (README, _headers, .github tidak).
      - name: Siapkan folder situs
        run: |
          mkdir _site
          cp -r index.html privasi assets sw.js manifest.webmanifest robots.txt sitemap.xml .well-known _site/

      - uses: actions/configure-pages@v5
      # v3: folder tersembunyi (.well-known) ikut terunggah
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
