# Deploy ke server sendiri setiap push ke main (atau manual dari tab Actions).
name: Deploy ke server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build JS & CSS
        run: npm ci && npm run build

      - name: Siapkan folder situs
        run: |
          mkdir _site
          cp -r index.html privasi ringkas assets sw.js manifest.webmanifest robots.txt sitemap.xml .well-known _site/

      - name: Pasang kunci SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Kirim ke server
        run: |
          rsync -rlz --delete --chmod=D755,F644 \
            --exclude=.well-known/acme-challenge \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            _site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"